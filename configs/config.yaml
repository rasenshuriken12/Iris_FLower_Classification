data:
  target: species
  test_size: 0.2
  random_state: 42

models:
  svm:
    C: 1.0
    kernel: rbf
    gamma: scale
  random_forest:
    n_estimators: 100
    random_state: 42

grid_search:
  svm:
    C: [0.1, 1, 10, 100]
    gamma: [scale, 0.01, 0.1, 1]
    kernel: [rbf, linear]

paths:
  raw_data: data/raw/iris.csv
  models_dir: models/
  reports_dir: reports/